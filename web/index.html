<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<script>
			const theme = localStorage.getItem('justgoto-theme');
			if (
				theme === 'dark' ||
				(theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
			) {
				document.documentElement.classList.add('dark');
			}
		</script>
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="description" content="Manage your JustGoto redirects and accounts." />
		<title>JustGoto</title>
	</head>
	<body>
		<div id="root"></div>
		<noscript
			>Enable JavaScript to use JustGoto. The API documentation is at
			<a href="/swagger-ui/">/swagger-ui/</a>.</noscript
		>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
