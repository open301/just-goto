name: Build binaries

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend
          path: web/dist
          if-no-files-found: error

  build:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-26.04, target: x86_64-unknown-linux-gnu, name: linux-amd64, extension: '' }
          - { runner: ubuntu-26.04-arm, target: aarch64-unknown-linux-gnu, name: linux-arm64, extension: '' }
          - { runner: windows-2025, target: x86_64-pc-windows-msvc, name: windows-amd64, extension: .exe }
          - { runner: windows-11-vs2026-arm, target: aarch64-pc-windows-msvc, name: windows-arm64, extension: .exe }
          - { runner: macos-26-intel, target: x86_64-apple-darwin, name: macos-amd64, extension: '' }
          - { runner: macos-26, target: aarch64-apple-darwin, name: macos-arm64, extension: '' }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend
          path: web/dist

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Prepare binary
        shell: bash
        run: |
          mkdir -p release
          cp "target/${{ matrix.target }}/release/justgoto${{ matrix.extension }}" "release/justgoto-${{ matrix.name }}${{ matrix.extension }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: justgoto-${{ matrix.name }}
          path: release/*
          if-no-files-found: error

      - name: Package release binary
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.name }}
          EXTENSION: ${{ matrix.extension }}
          VERSION: ${{ github.ref_name }}
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          binary = Path('target') / os.environ['TARGET'] / 'release' / ('justgoto' + os.environ['EXTENSION'])
          platform, arch = os.environ['PLATFORM'].split('-', 1)
          archive = f"just-goto_{platform}_{arch}_{os.environ['VERSION']}.zip"
          with ZipFile(archive, 'w', ZIP_DEFLATED) as package:
              package.write(binary, binary.name)
          PYTHON

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          name: release-${{ matrix.name }}
          path: just-goto_*.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release/*.zip --verify-tag --generate-notes
