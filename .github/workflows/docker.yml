name: Publish Docker images

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: zephnx/just-goto

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        variant: [alpine, debian-slim]
        include:
          - { variant: alpine, dockerfile: docker/Dockerfile.alpine }
          - { variant: debian-slim, dockerfile: docker/Dockerfile.debian }
          - { arch: amd64, runner: ubuntu-26.04 }
          - { arch: arm64, runner: ubuntu-26.04-arm }
        arch: [amd64, arm64]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Record image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-${{ matrix.variant }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        variant: [alpine, debian-slim]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.variant }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish multi-architecture image
        working-directory: /tmp/digests
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          VARIANT: ${{ matrix.variant }}
        run: |
          tags=(-t "$IMAGE:$VARIANT")
          if [[ "$REF_TYPE" == tag && "$REF_NAME" == v* ]]; then
            tags+=(-t "$IMAGE:${REF_NAME#v}-$VARIANT")
            if [[ "$VARIANT" == alpine ]]; then
              tags+=(-t "$IMAGE:${REF_NAME#v}")
            fi
          fi
          digests=()
          for digest in *; do
            digests+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create "${tags[@]}" "${digests[@]}"
