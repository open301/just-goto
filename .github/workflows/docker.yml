name: Publish Docker images

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: alpine, dockerfile: docker/Dockerfile.alpine }
          - { variant: debian-slim, dockerfile: docker/Dockerfile.debian }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tags
        id: tags
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          VARIANT: ${{ matrix.variant }}
        run: |
          image="zephnx/just-goto"
          if [[ "$REF_TYPE" == tag && "$REF_NAME" == v* ]]; then
            tags="$image:$VARIANT,$image:${REF_NAME#v}-$VARIANT"
            if [[ "$VARIANT" == alpine ]]; then
              tags+=",$image:${REF_NAME#v}"
            fi
            printf 'tags=%s\n' "$tags" >> "$GITHUB_OUTPUT"
          else
            printf 'tags=%s:%s\n' "$image" "$VARIANT" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
