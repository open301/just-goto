name: Pull request checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  eslint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - run: npm run lint

  cargo-check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The backend embeds these assets; placeholders allow type checking without a frontend build.
      - name: Create frontend placeholders
        run: |
          mkdir -p web/dist/assets
          touch web/dist/index.html web/dist/assets/app.js web/dist/assets/app.css

      - run: cargo check --locked --all-targets
