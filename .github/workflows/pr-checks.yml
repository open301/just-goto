name: Pull request checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  eslint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - run: npm run lint

  cargo-check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The backend embeds these assets; placeholders allow type checking without a frontend build.
      - name: Create frontend placeholders
        run: |
          mkdir -p web/dist/assets
          touch web/dist/index.html web/dist/assets/app.js web/dist/assets/app.css

      - run: cargo check --locked --all-targets
