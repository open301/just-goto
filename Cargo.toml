[package]
name = "justgoto"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["multipart"] }
csv = "1.4.0"
dotenvy = "0.15.7"
getrandom = "0.4.3"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net"] }
utoipa = { version = "6.0.0", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "10.0.1", default-features = false, features = ["axum", "vendored", "minified"] }

[dev-dependencies]
serde_json = "1.0.154"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
cloned_instead_of_copied = "warn"
dbg_macro = "warn"
inefficient_to_string = "warn"
missing_docs_in_private_items = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
redundant_clone = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
strip = true  # Automatically strip symbols from the binary.
lto = true
